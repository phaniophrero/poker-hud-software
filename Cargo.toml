[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/logging",
    "crates/config",
    "crates/game_state",
    "crates/hand_evaluator",
    "crates/hand_history",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SoftPoker contributors"]
license = "MIT"
repository = "https://github.com/your-org/softpoker-tracker"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
anyhow = "1"

# internal crates, referenced by path so every consumer stays in lockstep
softpoker-logging = { path = "crates/logging" }
softpoker-config = { path = "crates/config" }
softpoker-game-state = { path = "crates/game_state" }
softpoker-hand-evaluator = { path = "crates/hand_evaluator" }
softpoker-hand-history = { path = "crates/hand_history" }

# profile shared with the generated src-tauri/Cargo.toml release profile
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
