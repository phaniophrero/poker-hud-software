[package]
name = "softpoker-tracker"
version.workspace = true
description = "Poker hand-history tracker and offline analysis dashboard"
authors.workspace = true
license.workspace = true
edition.workspace = true

[lib]
# The `_lib` suffix is necessary to keep the lib name unique from the bin
# name; without it, Windows builds fail (rust-lang/cargo#8519).
name = "softpoker_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

softpoker-logging = { workspace = true }
softpoker-config = { workspace = true }
softpoker-game-state = { workspace = true }
softpoker-hand-history = { workspace = true }
softpoker-hand-evaluator = { workspace = true }
